name: offline-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.lock
      - run: npm run build
      - run: npm test
      - run: python -m pytest
      - run: python -m ruff check app tools python_tests
